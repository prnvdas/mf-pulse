name: ai-news

# Latest AI / tech headlines for the dashboard's second ticker bar, refreshed
# once a day at 08:00 IST (02:30 UTC), every day of the week.
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/ai_news.py
      - name: Commit
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "ai-news $(date -u +%F)"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
