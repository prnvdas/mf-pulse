name: cleanup

# Daily housekeeping for the GitHub side (src/housekeeping.py): deletes finished workflow runs older than 3 days, deletes old
# Pages deployment records (the newest 30 stay), and closes alert issues whose reason has passed (tests green again, the holiday
# is over, that month's statement is imported). It never touches the code, the data or the live site. Run it by hand with
# dry_run set to just list what it would do. Editing this file or the script also runs it once.
on:
  schedule:
    - cron: "40 21 * * *"        # 03:10 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would be deleted or closed"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/cleanup.yml"
      - "src/housekeeping.py"

permissions:
  actions: write
  issues: write
  deployments: write
  contents: read

concurrency:
  group: cleanup

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # the first big clean-up waits for GitHub's hourly request limit; daily runs take seconds
    env:
      GH_TOKEN: ${{ github.token }}
      DRY: ${{ github.event_name == 'push' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Tidy up
        run: |
          if [ "$DRY" = "true" ]; then python3 src/housekeeping.py --dry; else python3 src/housekeeping.py; fi
