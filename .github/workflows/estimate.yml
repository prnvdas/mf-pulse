name: estimate

# Every 15 minutes during NSE hours (09:15-15:30 IST = 03:45-10:00 UTC).
#
# Plus two runs after close, each with a different job:
#   15:50 IST (10:20 UTC) — the SETTLE run. Forced (bypasses the market-hours
#     gate) so it computes a genuinely fresh number, ~20 minutes after the
#     bell rather than snapshotting the instant it rings. That gap matters:
#     Yahoo's daily close for the session isn't always fully finalized at
#     the exact close second, so locking in at :00 risks freezing a still-
#     settling price as if it were final. This settle run's output is what
#     reconcile.py grades that night — it needs to be the real close, not
#     an early guess at it.
#   16:15 IST (10:45 UTC) — display-only. Flips that settled number to
#     `stale: true` so the UI stops implying it's still live. Does not
#     recompute or affect grading (reconcile.py keys off the generated date,
#     not the stale flag).
#
# Note: GitHub's scheduler is best-effort and can lag 5-20 minutes under load.
# That is fine for an end-of-day estimate; it would not be fine for trading.
on:
  schedule:
    - cron: "*/15 4-10 * * 1-5"
    - cron: "20 10 * * 1-5"
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estimate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle run (forced fresh read of finalized closing prices)
        if: github.event.schedule == '20 10 * * 1-5'
        run: python src/estimate.py --force
      - name: Intraday / stale-flip run
        if: github.event.schedule != '20 10 * * 1-5'
        run: python src/estimate.py
      - name: Commit dashboard data
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "estimate $(date -u +%FT%TZ)"
          git push
