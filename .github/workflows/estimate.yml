name: estimate

# Every 15 minutes during NSE hours (09:15-15:30 IST = 03:45-10:00 UTC),
# Monday-Friday only.
#
# Plus a SETTLE window after close: six forced attempts between 15:50 and
# 16:50 IST (10:20, 10:30, 10:40, 10:50, 11:05, 11:20 UTC). Each computes a
# fresh number from Yahoo's finalized closing prices rather than the instant
# the bell rings (the daily close isn't always settled at :00), and tags it
# phase="final" -- the number reconcile.py grades that night. A single
# attempt isn't something to hang that on: GitHub's scheduler is
# "best-effort," and this repo has seen runs land hours late. Attempts are
# idempotent (post-close prices don't change), so spreading six across an
# hour just raises the odds that at least one finishes before ~17:00 IST.
# Later non-forced runs never downgrade a final number from the same day.
on:
  schedule:
    - cron: "*/15 4-10 * * 1-5"
    - cron: "20 10 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "40 10 * * 1-5"
    - cron: "50 10 * * 1-5"
    - cron: "5 11 * * 1-5"
    - cron: "20 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estimate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle run (forced fresh read of finalized closing prices)
        if: >-
          github.event.schedule == '20 10 * * 1-5' ||
          github.event.schedule == '30 10 * * 1-5' ||
          github.event.schedule == '40 10 * * 1-5' ||
          github.event.schedule == '50 10 * * 1-5' ||
          github.event.schedule == '5 11 * * 1-5' ||
          github.event.schedule == '20 11 * * 1-5'
        run: python src/estimate.py --force
      - name: Intraday run
        if: >-
          github.event.schedule != '20 10 * * 1-5' &&
          github.event.schedule != '30 10 * * 1-5' &&
          github.event.schedule != '40 10 * * 1-5' &&
          github.event.schedule != '50 10 * * 1-5' &&
          github.event.schedule != '5 11 * * 1-5' &&
          github.event.schedule != '20 11 * * 1-5'
        run: python src/estimate.py
      # Headlines + the "why did the market move" explanation. Non-blocking: it
      # depends on third-party news feeds, and a dead feed must never hold up
      # (or fail) an estimate run.
      - name: News and market explanation
        continue-on-error: true
        run: python src/news.py
      - name: Commit dashboard data
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "estimate $(date -u +%FT%TZ)"
          git push
