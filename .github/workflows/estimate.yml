name: estimate

# Roughly every 15 minutes during NSE hours (09:22-15:37 IST, at :07/:22/:37/:52 UTC),
# Monday-Friday only.
#
# Plus a SETTLE window after close: six forced attempts between 15:53 and 17:08 IST
# (10:23, 10:38, 10:53, 11:08, 11:23, 11:38 UTC). Each computes a fresh number from
# Yahoo's finalized closing prices and tags it phase="final" -- the number
# reconcile.py grades that night. A single attempt isn't enough: GitHub's scheduler is
# best-effort, and this repo has seen runs land hours late or not at all (on 5 Oct
# nothing ran during market hours). So the schedule avoids the :00/:15/:30/:45
# marks, where delays and dropped runs concentrate, and every job has a timeout so
# one stalled run can't hold the queue for hours. Later non-forced runs never
# downgrade a final number from the same day.
on:
  schedule:
    - cron: "52 3 * * 1-5"
    - cron: "7,22,37,52 4-9 * * 1-5"
    - cron: "7 10 * * 1-5"
    - cron: "23 10 * * 1-5"
    - cron: "38 10 * * 1-5"
    - cron: "53 10 * * 1-5"
    - cron: "8 11 * * 1-5"
    - cron: "23 11 * * 1-5"
    - cron: "38 11 * * 1-5"
  # Also startable from outside the schedule (the dashboard's Refresh button, or an
  # external cron service) through the Actions API; `force` runs the full read even
  # outside market hours, which is what produces the end-of-day "final" number.
  workflow_dispatch:
    inputs:
      force:
        description: "Force a fresh read even outside market hours (use after the close)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: estimate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settle run (forced fresh read of finalized closing prices)
        if: >-
          inputs.force == true ||
          github.event.schedule == '23 10 * * 1-5' ||
          github.event.schedule == '38 10 * * 1-5' ||
          github.event.schedule == '53 10 * * 1-5' ||
          github.event.schedule == '8 11 * * 1-5' ||
          github.event.schedule == '23 11 * * 1-5' ||
          github.event.schedule == '38 11 * * 1-5'
        run: python src/estimate.py --force
      - name: Intraday run
        if: >-
          inputs.force != true &&
          github.event.schedule != '23 10 * * 1-5' &&
          github.event.schedule != '38 10 * * 1-5' &&
          github.event.schedule != '53 10 * * 1-5' &&
          github.event.schedule != '8 11 * * 1-5' &&
          github.event.schedule != '23 11 * * 1-5' &&
          github.event.schedule != '38 11 * * 1-5'
        run: python src/estimate.py
      # Headlines + the "why did the market move" explanation. Non-blocking: it
      # depends on third-party news feeds, and a dead feed must never hold up
      # (or fail) an estimate run.
      - name: News and market explanation
        continue-on-error: true
        timeout-minutes: 4
        run: python src/news.py
      # Next-session setup card: refreshed right after the close and in the morning as well, so it
      # doesn't depend on outlook.yml's own schedule alone. Non-blocking.
      - name: Next-session outlook
        if: >-
          inputs.force == true ||
          github.event.schedule == '52 3 * * 1-5' ||
          github.event.schedule == '53 10 * * 1-5'
        continue-on-error: true
        timeout-minutes: 4
        run: python src/outlook.py
      - name: GIFT Nifty snapshot
        continue-on-error: true
        timeout-minutes: 3
        run: python src/gift.py
      - name: Commit dashboard data
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "estimate $(date -u +%FT%TZ)"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
