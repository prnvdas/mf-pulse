name: gift

# GIFT Nifty (ex-SGX Nifty) snapshot for the "next session" card. It trades ~21 hours a day,
# so the useful readings are in the evening, overnight and just before the open. Started by
# the external cron (deploy/setup_cronjob.py) because GitHub's own scheduler is unreliable;
# the estimate and outlook workflows also take a snapshot whenever they run.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gift

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/gift.py
      # Re-run the outlook so the GIFT-adjusted range follows the new snapshot. Non-blocking.
      - name: Outlook (GIFT-adjusted range)
        continue-on-error: true
        timeout-minutes: 6
        run: pip install -q -r requirements-forecast.txt && python src/outlook.py
      - name: Commit
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "gift $(date -u +%FT%TZ)"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
