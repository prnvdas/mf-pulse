name: holdings

# AMCs disclose portfolios monthly, by the 10th. Run on the 12th to be safe,
# and allow manual triggering.
on:
  schedule:
    - cron: "0 4 12 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/fetch_holdings.py
      - run: python src/export_web.py
      - name: Commit refreshed holdings
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add config/holdings docs/data
          git diff --staged --quiet || git commit -m "holdings refresh $(date -u +%F)"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
