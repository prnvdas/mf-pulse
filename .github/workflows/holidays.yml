name: holidays

# Refreshes the NSE trading-holiday calendar (docs/data/holidays.json) and, each evening, opens an issue
# (-> email/phone notification) when a weekday closure comes before the next trading day, e.g. "Market closed on
# Fri 2 Oct 2026: Mahatma Gandhi Jayanti". Started daily by cron-job.org (20:10 IST); GitHub's own schedule is a backup.
on:
  schedule:
    - cron: "40 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: holidays

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh the holiday calendar
        continue-on-error: true
        run: python src/holidays.py
      - name: Commit
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "holidays $(date -u +%F)"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
      - name: Remind me about a coming closure
        run: python src/holidays.py --remind
