name: monthly-reminder

# Opens a GitHub issue on the 3rd of every month (10:00 IST) assigned to the repo owner, which GitHub turns into
# an email / mobile notification: time to upload the Groww holdings statement (see STATEMENTS.md).
on:
  schedule:
    - cron: "30 4 3 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Close last month's reminder, open this month's
        run: |
          gh issue list -R "$REPO" --state open --search 'in:title "Upload your Groww statement"' --json number -q '.[].number' \
            | xargs -r -I{} gh issue close {} -R "$REPO" --comment "Superseded by this month's reminder."
          gh issue create -R "$REPO" --assignee "$OWNER" \
            --title "Upload your Groww statement — $(date +'%B %Y')" \
            --body "$(cat <<'BODY'
          Your SIPs are allotted today, so once Groww shows them (usually the next day) it is time for the monthly sync.

          1. In Groww: Mutual Funds, then Reports / Download, then the **holdings statement (.xlsx)**.
          2. Save it into the `MF-Holding/` folder of this project on your computer.
          3. Run `python src/encrypt_statement.py --push` (it asks for your passphrase, encrypts the file and pushes it).
          4. The `statement` workflow imports it by itself within a couple of minutes. A green run in the Actions tab means it was applied.

          The plain statement holds your PAN and phone number and never goes to GitHub: only the encrypted copy does.
          BODY
          )"
