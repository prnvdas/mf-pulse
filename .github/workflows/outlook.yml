name: outlook

# "Next session setup" card: expected move size and the overnight-US lean.
#   07:30 IST (02:07 UTC) -- the US has closed, so the lean is available; retried at 08:17 and 09:07 IST
#   because GitHub's scheduler can drop or delay a run (it did on 5 Oct)
#   17:30 IST (12:00 UTC) -- range for the next session (the lean is 'pending' until the US closes)
# Monday-Friday. Separate from the estimate job so a failure here can't affect it.
on:
  schedule:
    - cron: "7 2 * * 1-5"
    - cron: "47 2 * * 1-5"
    - cron: "37 3 * * 1-5"
    - cron: "7 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/outlook.py
      - name: GIFT Nifty snapshot
        continue-on-error: true
        timeout-minutes: 3
        run: python src/gift.py
      - name: Commit
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "outlook $(date -u +%FT%TZ)"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
