name: picks

# Weekly ideas: five crypto coins and five Indian stocks that screen best for upside, with reasons, risks and a running
# track record of earlier picks (src/picks.py -> docs/data/picks.json). A screen of public data, not advice.
# Started by cron-job.org on Sundays at 19:30 IST; GitHub's own schedule is the backup.
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crypto and stock screens
        run: python src/picks.py
      - name: Commit
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          python3 src/validate_data.py --fix   # never publish a broken data file
          git add -A docs/data config
          git diff --staged --quiet || git commit -m "weekly ideas $(date -u +%F)"
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
