name: reconcile

# AMFI publishes NAV around 22:00-23:00 IST. We check at 23:15 IST (17:45 UTC)
# and retry at 00:45 IST in case publication ran late.
#
# Runs Saturdays too: NSE occasionally holds special Saturday trading
# sessions, and if one happens AMFI publishes a real NAV for it that needs
# grading same as any other day. On an ordinary Saturday with no new trading,
# reconcile.py's own "NAV unchanged" check finds nothing to do and no commit
# happens -- this is just insurance for the rare real session, not something
# that produces new output most weeks.
on:
  schedule:
    - cron: "45 17 * * 1-6"
    - cron: "15 19 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/reconcile.py
      # reconcile.py updates units/last_nav in state.json nightly (new NAV,
      # SIP purchases), but config.json — what the browser reads for its own
      # client-side inference and "Refresh live" — is otherwise only rebuilt
      # by the monthly holdings.yml run. Without this, config.json silently
      # drifts stale against state.json every night in between.
      - run: python src/export_web.py
      - name: Commit reconciliation
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "reconcile $(date -u +%F)"
          git push
