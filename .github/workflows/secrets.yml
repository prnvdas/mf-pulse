name: secret scan

# Looks for leaked tokens and keys (gitleaks' default rules) and for the personal identifiers that must never be
# committed (PAN, mobile number; see .gitleaks.toml). Free: the repository is public and gitleaks runs as a plain binary.
# A failed run is emailed to you by GitHub like any other failed workflow. Findings are redacted in the log.
#
# If it ever fails: the secret is already public, so revoke or change it first; deleting the file does not remove it
# from history.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 2 * * 1"      # every Monday, 08:10 IST: the whole history, in case a rule was added or a push slipped past
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks version
      - name: Scan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # a push is checked on its new commits only (fast); everything else on the whole history
          RANGE=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="--log-opts=${BEFORE}..${GITHUB_SHA}"
          fi
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner $RANGE
