name: sync-screenshot

# Upload a Groww / IndMoney holdings screenshot to screenshots/ and this updates
# invested amounts and units from it. See screenshots/README.md.
on:
  push:
    branches: [main]
    paths:
      - "screenshots/*.png"
      - "screenshots/*.jpg"
      - "screenshots/*.jpeg"
      - "screenshots/*.webp"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-screenshot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ocr.txt
      - run: pip install -r requirements.txt -r requirements-ocr.txt

      # The OCR engine is offline: the image never leaves this runner.
      - name: Read the screenshot and validate
        id: sync
        continue-on-error: true
        run: |
          set -o pipefail
          python src/sync_screenshot.py 2>&1 | tee sync.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Screenshot sync: ${{ steps.sync.outcome }}"
            echo '```'
            cat sync.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild web data (only if the sync succeeded)
        if: steps.sync.outcome == 'success'
        run: python src/export_web.py

      # The image is removed whether or not it parsed, so a screenshot of your
      # portfolio doesn't sit in the repo. (It stays in git history.)
      - name: Commit result and remove the screenshot
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          find screenshots -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | xargs -0 -r git rm -q
          git add docs/data
          git diff --staged --quiet || git commit -m "sync-screenshot: ${{ steps.sync.outcome }} ($(date -u +%F))"
          # Retry: another workflow may push between our pull and push. Our fresh data wins any conflict.
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1

      - name: Fail the run if nothing validated
        if: steps.sync.outcome == 'failure'
        run: exit 1
