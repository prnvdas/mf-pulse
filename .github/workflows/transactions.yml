name: transactions

# Imports Groww's mutual-fund TRANSACTION report (your full buy/sell history). Same privacy rules as the holdings
# statement: the plain report (name, PAN, phone, folio numbers) is encrypted on your computer with
# `python src/encrypt_statement.py --transactions --push`, decrypted here with the STATEMENT_KEY secret on the
# runner's temporary disk, and only dates, amounts and units are kept (config/transactions.csv).
# It then rebuilds the money-over-time history from your first purchase and the exact XIRR and tax lots.
on:
  push:
    paths:
      - "statements/tx-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statement

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATEMENT_KEY: ${{ secrets.STATEMENT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decrypt and import
        run: |
          f=$(ls -1 statements/tx-*.enc 2>/dev/null | sort | tail -1 || true)
          if [ -z "$f" ]; then echo "No transaction report in statements/"; exit 1; fi
          if [ -z "$STATEMENT_KEY" ]; then echo "::error::Add the STATEMENT_KEY repository secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          plain="$RUNNER_TEMP/$(basename "${f%.enc}")"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$f" -out "$plain" -pass env:STATEMENT_KEY
          python src/import_transactions.py "$plain"
          rm -f "$plain"
      - name: Rebuild history, XIRR and tax lots
        continue-on-error: true
        run: |
          python src/detect_sips.py
          python src/snapshot.py --backfill
          python src/analytics.py
          python src/tax.py
      - name: Commit
        run: |
          git config user.name  "mf-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data config
          git diff --staged --quiet || git commit -m "transactions import $(date -u +%F)"
          for n in 1 2 3 4; do
            git pull --rebase --autostash -X theirs -q origin main && git push -q && exit 0
            sleep $((n * 6))
          done
          echo "push failed after 4 attempts" >&2; exit 1
