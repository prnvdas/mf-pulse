# Secret scan for MF Pulse (run by .github/workflows/secrets.yml). The default rules catch tokens and keys;
# the two rules below catch the personal identifiers that must never be committed (see CLAUDE.md).
title = "MF Pulse"

[extend]
useDefault = true

[[rules]]
id = "indian-pan"
description = "Indian PAN number (5 letters, 4 digits, 1 letter)"
regex = '''\b[A-Z]{5}[0-9]{4}[A-Z]\b'''
keywords = []

[rules.allowlist]
description = "the dummy PANs used in tests"
regexes = ['''AAAAA0000A''', '''ABCDE1234F''']

[[rules]]
id = "indian-mobile"
description = "Indian mobile number (10 digits starting 6-9)"
regex = '''(?:^|[^0-9.,])(?:\+?91[ -]?)?[6-9][0-9]{9}(?:$|[^0-9.,])'''
keywords = []
