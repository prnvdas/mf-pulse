# ---------------------------------------------------------------------------
# MF Pulse — portfolio configuration
#
# `units` is the number that actually matters. Groww shows you rupees; the
# engine needs units. If you don't know them, leave units: null and set
# seed_value — the first reconcile run will back-solve units from AMFI NAV
# and write them in.
#
# `amfi_code` is the scheme code from https://www.amfiindia.com/spages/NAVAll.txt
# (grep the file for the scheme name — it's the first column).
# ---------------------------------------------------------------------------

currency: INR
timezone: Asia/Kolkata

market:
  open: "09:15"
  close: "15:30"
  # Estimates outside this window are marked `stale: true` in the JSON.

# Sessions outside the normal Mon-Fri 09:15-15:30 pattern (Diwali Muhurat trading,
# occasional special Saturday sessions). Times are IST. The server treats these as
# open, and the page's Refresh goes live during them instead of saying "market
# closed". When NSE publishes the circular, set the exact start/end and drop
# `provisional`. For each new entry also add its cron line to
# .github/workflows/special-session.yml (python src/special_sessions_cron.py prints them).
special_sessions:
  - date: "2026-11-08"
    name: Diwali Muhurat trading
    start: "17:30"      # provisional window; NSE announces the exact hour (usually ~1h around 18:00-19:15)
    end: "20:00"
    provisional: true

funds:
  - id: axis-small-cap
    name: Axis Small Cap Fund Direct Growth
    amfi_code: 125354
    ter_annual_pct: 0.55       # direct plan TER
    benchmark_ticker: "NIFTYSMLCAP250.NS" # Nifty Smallcap 250 index (Axis small cap benchmark); Yahoo ^CNXSC stopped updating
    groww_slug: axis-small-cap-fund-direct-growth
    analytics_benchmark:
      name: Nifty Smallcap 250
      note: index level (price return); P/E comes from the HDFC Nifty Smallcap 250 ETF, which holds the same basket
      returns: [{ticker: "NIFTYSMLCAP250.NS", weight: 1.0}]
      pe: [{ticker: "HDFCSML250.NS", weight: 1.0}]
    units: null
    seed_value: 5312000    # synced from IndMoney 2026-10-03
    seed_invested: 4125000 # synced from IndMoney 2026-10-03

  - id: mirae-large-midcap
    name: Mirae Asset Large & Midcap Fund Direct Growth
    amfi_code: 118834
    ter_annual_pct: 0.49
    benchmark_ticker: "^NSEMDCP50"
    groww_slug: mirae-asset-large-midcap-fund-direct-growth
    analytics_benchmark:
      name: Nifty LargeMidcap 250
      note: approx. 70/30 blend of the Nifty 100 and Nifty Midcap 150 ETFs (the index is Nifty 100 + Midcap 150, roughly 70% large-cap by weight); price return
      returns: [{ticker: "HDFCNIF100.NS", weight: 0.7}, {ticker: "HDFCMID150.NS", weight: 0.3}]
      # longer-history proxy (large + midcap indices) used only for the XIRR comparison, because the HDFC
      # midcap ETF above only exists since Mar 2025 and some purchases are older
      xirr_returns: [{ticker: "^NSEI", weight: 0.7}, {ticker: "^NSEMDCP50", weight: 0.3}]
      pe: [{ticker: "HDFCNIF100.NS", weight: 0.7}, {ticker: "HDFCMID150.NS", weight: 0.3}]
    units: null
    seed_value: 4959000    # synced from IndMoney 2026-10-03
    seed_invested: 4075000 # synced from IndMoney 2026-10-03

  - id: jioblackrock-flexicap
    name: JioBlackRock Flexi Cap Fund Direct Growth
    amfi_code: 153859
    ter_annual_pct: 0.50
    benchmark_ticker: "^CRSLDX" # Nifty 500
    groww_slug: jioblackrock-flexi-cap-fund-direct-growth
    analytics_benchmark:
      name: Nifty 500
      note: index level (price return); benchmark P/E is approximated from a 75/15/10 large/mid/small ETF mix
      returns: [{ticker: "^CRSLDX", weight: 1.0}]
      pe: [{ticker: "HDFCNIF100.NS", weight: 0.75}, {ticker: "HDFCMID150.NS", weight: 0.15}, {ticker: "HDFCSML250.NS", weight: 0.10}]
    units: null
    seed_value: 179820    # synced from IndMoney 2026-10-03
    seed_invested: 187000 # synced from IndMoney 2026-10-03

# Monthly SIP debits. Without these, units drift and the P&L quietly goes wrong.
# Debited on the 1st; `day_of_month` here is the NAV allocation date (the
# fund house takes ~1-2 business days to realize funds and allot units), not
# the debit date -- reconcile.py buys units at whichever NAV is current on
# this day, so it has to match allocation, not debit.
sips:
  - fund_id: axis-small-cap
    amount: 50000
    day_of_month: 3
  - fund_id: mirae-large-midcap
    amount: 50000
    day_of_month: 3
  - fund_id: jioblackrock-flexicap
    amount: 10000
    day_of_month: 3

estimator:
  # How the untracked tail of each fund is modelled.
  #   benchmark -> assume it moves like the fund's benchmark index
  #   scale     -> assume it moves like the tracked portion (naive, riskier)
  tail_model: benchmark
  # Holdings older than this are flagged in the UI.
  holdings_stale_days: 45

# Long-horizon "where could this be" projection shown on the dashboard.
# Pure illustration from today's value plus the configured SIPs above,
# compounding at each annual return (CAGR) listed -- not a forecast, not a
# promise. 12% is a common long-run planning assumption for diversified
# Indian equity; 15/18/22% are optimistic scenarios (22% held for decades
# would be exceptional), shown so you can see the spread, not as targets.
# Rows are calendar year-ends: the first is the end of the current year
# (counting only the SIPs still to come this year), then each horizon below
# counts that many further years.
projection:
  scenarios_pct: [12, 15, 18, 22]
  horizons_years: [1, 3, 5, 7, 10, 15, 20, 25]

# Used by the fund-vs-benchmark analytics (alpha, Sharpe). India's ~10-year
# government bond yield is a common stand-in for the risk-free rate.
analytics:
  risk_free_pct: 6.5

# Used by the daily greeting on the dashboard.
profile:
  name: Pranav
  fd_rate_pct: 7   # rough bank fixed-deposit yield, used only as a yardstick
  github_repo: prnvdas/mf-pulse   # used by the optional on-demand update button

# Capital-gains view (Tax panel). Equity-oriented mutual funds. These are the rules as last known to the
# author -- tax law changes, so CHECK them for the current financial year and edit here.
tax:
  stcg_pct: 20            # short-term (held 12 months or less)
  ltcg_pct: 12.5          # long-term
  ltcg_exempt_inr: 125000 # long-term gains exempt per financial year (across all your equity funds/stocks)
  cess_pct: 4
  long_term_days: 365
  realized_ltcg_this_fy: 0   # long-term gains you have ALREADY booked this FY (any fund or share): lowers the tax-free room
  realized_stcg_this_fy: 0
  sip_months_assumed: 13     # lots are estimated from this many months of SIPs unless config/transactions.csv exists

# Goals (Goal tracker panel). You normally add goals on the dashboard itself ("What are you saving for?", saved in that
# browser). To keep some permanently for every device, list them here; amounts are in TODAY's rupees:
#   - {id: house, name: "Buy a house", target_today_inr: 10000000, target_year: 2034, inflation_pct: 6, share_pct: 50}
goals: []
goal_scenarios_pct: [10, 12, 15]   # yearly return cases shown as slower / normal / better markets
