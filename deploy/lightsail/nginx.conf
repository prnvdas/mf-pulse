server {
    listen 80 default_server;
    server_name _;

    root /opt/mf-pulse/docs;
    index index.html;

    # dashboard
    location / {
        try_files $uri $uri/ =404;
    }

    # JSON written by the timers — never cache, it changes every 15 min
    location /data/ {
        add_header Cache-Control "no-cache, max-age=15";
    }

    # price endpoint
    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
